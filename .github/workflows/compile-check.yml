name: Compile check

# Fast feedback for phase branches: does everything compile, do unit tests pass, are permissions allowed.
# Doesn't ship anything, so it has no gate and no publishing.
on:
  push:
    branches: ["phase/**"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  # Any other branch: start it by hand (Actions -> Compile check -> Run workflow) for the same fast check without the emulator.
  workflow_dispatch:

permissions: {}

# A newer commit cancels the superseded run on every ref except the integration branch and main.
concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/ccr-dff99af5-ij1rle' && github.ref != 'refs/heads/main' }}

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Dependency verification mode
        id: verify
        run: .github/scripts/verify-mode.sh
      - name: Build, unit tests, permission checks
        env:
          VERIFY: ${{ steps.verify.outputs.flag }}
        run: ./gradlew --no-daemon $VERIFY assembleDebug test verifyPermissions
      - name: Check built APK permissions
        run: scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk debug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.verify.outputs.written == 'true'
        with:
          name: verification-metadata-compile
          path: gradle/verification-metadata.xml
          retention-days: 14

      - name: Print the written metadata as annotations, part 1 (for sessions that cannot download artifacts)
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-compile 0

      - name: Print the written metadata as annotations, part 2
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-compile 10

      - name: Print the written metadata as annotations, part 3
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-compile 20

      - name: Fail until the dependency verification metadata is committed
        if: steps.verify.outputs.written == 'true'
        run: |
          echo "::error::Dependencies were not verified: commit the gradle/verification-metadata.xml the jobs wrote (the union of every job's verification-metadata-* artifact; see gate/README.md)."
          exit 1
