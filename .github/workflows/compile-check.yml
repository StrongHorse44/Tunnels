name: Compile check

# Fast feedback for phase branches: does everything compile, do unit tests pass, are permissions allowed.
on:
  push:
    branches: ["phase/**"]
  # Any other branch: start it by hand (Actions -> Compile check -> Run workflow) for the same fast check without the emulator.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests, permission checks
        run: ./gradlew --no-daemon assembleDebug test verifyPermissions
      - name: Check built APK permissions
        run: scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk debug
