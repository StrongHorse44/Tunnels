name: Phase 5

# Tests only the modules that belong to phase 5. Runs on this phase's branches, integration and main when they change.
on:
  push:
    branches:
      - 'phase/5-**'
      - 'dev'
      - 'main'
    paths:
      - 'tunnels/homenet/**'
      - 'core/lan/**'
      - '.github/workflows/ci-phase-5.yml'
  pull_request:
    paths:
      - 'tunnels/homenet/**'
      - 'core/lan/**'
      - '.github/workflows/ci-phase-5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and permission checks
        run: ./gradlew --no-daemon :tunnels:homenet:testDebugUnitTest :tunnels:homenet:verifyPermissions :core:lan:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-5-unit-reports
          path: |
            tunnels/*/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 7

  emulator:
    name: Instrumented tests (emulator)
    # Emulator minutes are the expensive part: always on integration and main, and on a phase branch
    # only when the commit message carries [emulator] (builders tag their final commit).
    if: github.ref_name == 'dev' || github.ref_name == 'main' || github.event_name != 'push' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 /usr/lib/jvm/temurin-21-jdk-amd64 || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :tunnels:homenet:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-5-instrumented-reports
          path: tunnels/*/build/reports/androidTests/
          retention-days: 7
