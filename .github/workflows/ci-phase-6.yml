name: Phase 6

# Tests only the modules that belong to phase 6. Runs when they change, on any branch.
on:
  push:
    paths:
      - 'tunnels/deepmode/**'
      - '.github/workflows/ci-phase-6.yml'
  pull_request:
    paths:
      - 'tunnels/deepmode/**'
      - '.github/workflows/ci-phase-6.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and permission checks
        run: ./gradlew --no-daemon :tunnels:deepmode:testDebugUnitTest :tunnels:deepmode:verifyPermissions
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-6-unit-reports
          path: |
            tunnels/*/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 7

  emulator:
    name: Instrumented tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :tunnels:deepmode:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-6-instrumented-reports
          path: tunnels/*/build/reports/androidTests/
          retention-days: 7
