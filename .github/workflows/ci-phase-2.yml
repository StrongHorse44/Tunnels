name: Phase 2

# Tests only the modules that belong to phase 2. Runs on this phase's branches, integration and main when they change.
on:
  push:
    branches:
      - 'phase/2-**'
      - 'ccr-dff99af5-ij1rle'
      - 'main'
    paths:
      - 'tunnels/timeline/**'
      - 'tunnels/notifications/**'
      - 'core/notifrules/**'
      - '.github/workflows/ci-phase-2.yml'
  pull_request:
    paths:
      - 'tunnels/timeline/**'
      - 'tunnels/notifications/**'
      - 'core/notifrules/**'
      - '.github/workflows/ci-phase-2.yml'
  workflow_dispatch:

permissions: {}

# A newer commit cancels the superseded run on every ref except the integration branch and main.
concurrency:
  group: phase-2-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/ccr-dff99af5-ij1rle' && github.ref != 'refs/heads/main' }}

# Doesn't ship anything, so it has no release gate and no publishing.
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Dependency verification mode
        id: verify
        run: .github/scripts/verify-mode.sh
      - name: Unit tests and permission checks
        env:
          VERIFY: ${{ steps.verify.outputs.flag }}
        run: ./gradlew --no-daemon $VERIFY :tunnels:timeline:testDebugUnitTest :tunnels:timeline:verifyPermissions :tunnels:notifications:testDebugUnitTest :tunnels:notifications:verifyPermissions :core:notifrules:test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phase-2-unit-reports
          path: |
            tunnels/*/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.verify.outputs.written == 'true'
        with:
          name: verification-metadata-phase-2-unit
          path: gradle/verification-metadata.xml
          retention-days: 14

      - name: Print the written metadata as annotations, part 1 (for sessions that cannot download artifacts)
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-phase-2-unit 0

      - name: Print the written metadata as annotations, part 2
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-phase-2-unit 10

      - name: Print the written metadata as annotations, part 3
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-phase-2-unit 20

      - name: Fail until the dependency verification metadata is committed
        if: steps.verify.outputs.written == 'true'
        run: |
          echo "::error::Dependencies were not verified: commit the gradle/verification-metadata.xml the jobs wrote (the union of every job's verification-metadata-* artifact; see gate/README.md)."
          exit 1

  emulator:
    name: Instrumented tests (emulator)
    # Emulator minutes are the expensive part: always on integration and main, and on a phase branch
    # only when the commit message carries [emulator] (builders tag their final commit).
    if: github.ref_name == 'ccr-dff99af5-ij1rle' || github.ref_name == 'main' || github.event_name != 'push' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Dependency verification mode
        id: verify
        run: .github/scripts/verify-mode.sh
      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 /usr/lib/jvm/temurin-21-jdk-amd64 || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          VERIFY: ${{ steps.verify.outputs.flag }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon $VERIFY :tunnels:timeline:connectedDebugAndroidTest :tunnels:notifications:connectedDebugAndroidTest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phase-2-instrumented-reports
          path: tunnels/*/build/reports/androidTests/
          retention-days: 7
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.verify.outputs.written == 'true'
        with:
          name: verification-metadata-phase-2-emulator
          path: gradle/verification-metadata.xml
          retention-days: 14

      - name: Print the written metadata as annotations, part 1 (for sessions that cannot download artifacts)
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-phase-2-emulator 0

      - name: Print the written metadata as annotations, part 2
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-phase-2-emulator 10

      - name: Print the written metadata as annotations, part 3
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-phase-2-emulator 20

      - name: Fail until the dependency verification metadata is committed
        if: steps.verify.outputs.written == 'true'
        run: |
          echo "::error::Dependencies were not verified: commit the gradle/verification-metadata.xml the jobs wrote (the union of every job's verification-metadata-* artifact; see gate/README.md)."
          exit 1
