name: CI

# Full build of the integration branch and main: everything compiles, every unit test passes,
# permissions are allowed, the app launches on an emulator, and a numbered debug build is published.
on:
  push:
    branches: ["ccr-dff99af5-ij1rle", "main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, permission checks, debug build
        run: >
          ./gradlew --no-daemon test verifyPermissions assembleDebug
          -Ptunnels.versionCode=${{ github.run_number }}
          -Ptunnels.versionName=0.1.0-dev.${{ github.run_number }}

      - name: Check built APK permissions
        run: scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk debug

      - uses: actions/upload-artifact@v4
        with:
          name: tunnels-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # One prerelease per build, newest first, with a plain .apk you can tap on the phone
      # (Actions artifacts always arrive zipped). Keeps the newest 10.
      - name: Publish debug build
        if: github.event_name == 'push' && github.ref_name != 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.run_number }}
        run: |
          short="${GITHUB_SHA::7}"
          apk="tunnels-debug-$N.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          # The in-app updater checks the download against this.
          sha256sum "$apk" > "$apk.sha256"
          {
            git log -1 --format=%B
            echo
            echo "---"
            echo "Debug build #$N of \`$short\` from \`$GITHUB_REF_NAME\`. Installs as \"Tunnels\" (package \`io.github.stronghorse44.tunnels.debug\`) and updates over earlier debug builds."
          } > notes.md
          gh release create "debug-$N" "$apk" "$apk.sha256" --prerelease --target "$GITHUB_SHA" \
            --title "Debug build #$N ($short)" --notes-file notes.md
          gh release delete debug-latest --yes --cleanup-tag 2>/dev/null || true
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^debug-[0-9]+$' | sort -t- -k2 -n -r | tail -n +11 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag

  smoke:
    name: App smoke test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 /usr/lib/jvm/temurin-21-jdk-amd64 || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest :core:runtime:connectedDebugAndroidTest :tunnels:updater:connectedDebugAndroidTest :tunnels:crossroads:connectedDebugAndroidTest :tunnels:watch:connectedDebugAndroidTest :tunnels:devicecheck:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-smoke-reports
          path: |
            app/build/reports/androidTests/
            core/runtime/build/reports/androidTests/
            tunnels/updater/build/reports/androidTests/
            tunnels/crossroads/build/reports/androidTests/
            tunnels/watch/build/reports/androidTests/
            tunnels/devicecheck/build/reports/androidTests/
          retention-days: 7
