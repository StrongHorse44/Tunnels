name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, no-INTERNET check, debug build
        run: ./gradlew --no-daemon test verifyNoInternet assembleDebug

      - name: Check built APK permissions
        run: scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: tunnels-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      # Plain .apk you can tap on the phone (Actions artifacts always arrive zipped).
      - name: Publish rolling debug build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk tunnels-debug.apk
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest tunnels-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build (latest)" \
            --notes "Debug build of ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}. Installs as \"Tunnels (debug)\" next to release builds. Signed with the public debug key in the repo, so it updates over earlier debug builds."
