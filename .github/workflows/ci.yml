# Full build of the integration branch and main: everything compiles, every unit test passes,
# permissions are allowed, the release gate (gate/baseline.json) matches the APK, the app launches on an
# emulator, and a push to the integration branch publishes a numbered debug build.
#
# This workflow publishes the DEBUG variant ("Debug build #N"), signed with the public key committed in
# app/debug.keystore. The release gate (gate/gate.py) compares that APK with gate/baseline.json: a new
# permission, exported component, native library, network API, host literal, runtime dependency, SDK level or
# backup flag fails the build unless the same pull request updates the baseline (gate/README.md). The gate runs
# in this workflow before anything is published, so an unlisted change can never reach Releases. The certificate
# pin proves little while the signing key is public: it only catches an accidental key change.
#
# The RELEASE variant (the vX.Y.Z channel, signed by release.yml with the owner's key) is built here on every run
# too, unsigned, and gated against gate/baseline.release.json, so a pull request that changes what a release can
# do must change that baseline. This workflow never signs or publishes a release. If the release baseline is
# missing, the run fails.
#
# Dependencies are checked against gradle/verification-metadata.xml. If that file is missing (delete it to
# regenerate after a dependency change), every Gradle job writes one from its real tasks, attaches it to the
# run and fails so it gets committed.
#
# Only a push to the integration branch publishes. Pull requests and manual runs build, test and check the
# gate, and never publish. No job that runs this repository's build code holds a token that can write
# anything: publishing is in its own job, which runs no repository code.

name: CI

# Docs don't change the APK. (Path filters don't apply to the manual trigger.)
on:
  push:
    branches: ["ccr-dff99af5-ij1rle", "main"]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions: {}

env:
  # The build-tools the release gate's apksigner/aapt2 come from, as in release.yml (the newest installed is not used).
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # A pull request's older run is cancelled when a newer commit arrives. A push (or manual run) gets a group
    # of its own, so it is never cancelled and never queues behind another run.
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ci-build-pr-{0}', github.ref) || format('ci-build-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # The base branch's gate files, so the gate can list what this pull request changes in the baseline.
      # Checked out here, before any build code runs, so no step after this needs a token.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .gate-base
          persist-credentials: false
          sparse-checkout: gate

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Check the Gradle wrapper against Gradle's published checksums
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          version=$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-bin\.zip$#\1#p' "$props")
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-bin.zip.sha256")
          pinned=$(sed -n 's/^distributionSha256Sum=//p' "$props")
          if [ "$published" != "$pinned" ]; then
            echo "::error::distributionSha256Sum ($pinned) is not Gradle's published checksum ($published)"
            exit 1
          fi
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          if [ "$published" != "$actual" ]; then
            echo "::error::gradle-wrapper.jar ($actual) is not Gradle's published $version wrapper ($published)"
            exit 1
          fi
          echo "Gradle $version wrapper and distribution checksums match gradle.org"

      - name: Dependency verification mode
        id: verify
        run: .github/scripts/verify-mode.sh

      # One Gradle invocation builds everything that is checked: unit tests, the permission checks, the shipped
      # debug APK, the release variant (unsigned: this job never holds the release key) and the dependency
      # reports the gate reads. Verification is forced on the command line.
      - name: Unit tests, permission checks, debug and release builds
        env:
          VERIFY: ${{ steps.verify.outputs.flag }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace $VERIFY \
            --init-script gate/file-dependencies.init.gradle -Pgate.configuration=debugRuntimeClasspath \
            -Ptunnels.versionCode="$RUN_NUMBER" -Ptunnels.versionName="0.1.0-dev.$RUN_NUMBER" \
            test verifyPermissions assembleDebug assembleRelease \
            :app:dependencies --configuration debugRuntimeClasspath gateFileDependencies | tee "$RUNNER_TEMP/gradle.log"

      # The release gate reads a dependency report for the release configuration; the step above produced the
      # debug one. (A second Gradle run: one run cannot hold two :app:dependencies reports.)
      - name: Release dependency report
        env:
          VERIFY: ${{ steps.verify.outputs.flag }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace $VERIFY \
            --init-script gate/file-dependencies.init.gradle -Pgate.configuration=releaseRuntimeClasspath \
            :app:dependencies --configuration releaseRuntimeClasspath gateFileDependencies | tee "$RUNNER_TEMP/gradle-release.log"

      - name: Check built APK permissions
        run: |
          scripts/check-apk-permissions.sh app/build/outputs/apk/debug/app-debug.apk debug
          scripts/check-apk-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk release

      # The debug APK is what ships, so it is what the gate checks. In a pull request the gate lists every
      # baseline field the pull request changes (the certificate pin included).
      - name: Release gate (compare the debug APK with gate/baseline.json)
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          compare=()
          if [ "$EVENT" = pull_request ]; then
            compare=(--compare-to .gate-base/gate/baseline.json)  # absent if the base branch has none yet
          fi
          python3 gate/gate.py check --require-tools --require-pin --apk app/build/outputs/apk/debug/app-debug.apk \
            --deps "$RUNNER_TEMP/gradle.log" --generated build/gate/baseline.generated.json "${compare[@]}"
          python3 -m unittest discover -s gate

      # The release variant, unsigned, against the release baseline (fails closed if there is none). The signing
      # certificate is compared by release.yml on the signed APK, never here. In a pull request the gate lists
      # every field the pull request changes in the release baseline.
      - name: Release gate (compare the unsigned release APK with gate/baseline.release.json)
        id: gate-release
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ ! -f gate/baseline.release.json ]; then
            echo "::error::gate/baseline.release.json is missing, so there is no reviewed record of what a release build may do."
            exit 1
          fi
          compare=()
          if [ "$EVENT" = pull_request ]; then
            compare=(--compare-to .gate-base/gate/baseline.release.json)  # absent if the base branch has none yet
          fi
          export APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          export AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          python3 gate/gate.py check --baseline gate/baseline.release.json --require-tools --require-pin \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk --deps "$RUNNER_TEMP/gradle-release.log" \
            --generated build/gate/baseline.release.generated.json "${compare[@]}"

      # So a session that can't download artifacts can copy the baseline this APK would need.
      - name: Print the baseline this APK would need
        if: failure() && steps.gate.outcome == 'failure' && hashFiles('build/gate/baseline.generated.json') != ''
        run: |
          echo "::group::build/gate/baseline.generated.json"
          cat build/gate/baseline.generated.json
          echo "::endgroup::"
          gate/annotate-file.sh build/gate/baseline.generated.json baseline-generated 0

      - name: Print the release baseline this APK would need
        if: failure() && steps.gate-release.outcome == 'failure' && hashFiles('build/gate/baseline.release.generated.json') != ''
        run: |
          echo "::group::build/gate/baseline.release.generated.json"
          cat build/gate/baseline.release.generated.json
          echo "::endgroup::"
          gate/annotate-file.sh build/gate/baseline.release.generated.json baseline-release-generated 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tunnels-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          # Pull request and manual builds are only for checking; only a push to the integration branch publishes.
          # 30 days, GitHub's limit for a run waiting for approval; the APK expires with the artifact, so approve well
          # before then.
          retention-days: ${{ github.event_name == 'push' && 30 || 3 }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/gate/
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.verify.outputs.written == 'true'
        with:
          name: verification-metadata-build
          path: gradle/verification-metadata.xml
          retention-days: 14

      - name: Print the written metadata as annotations, part 1 (for sessions that cannot download artifacts)
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-build 0

      - name: Print the written metadata as annotations, part 2
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-build 10

      - name: Print the written metadata as annotations, part 3
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-build 20

      - name: Fail until the dependency verification metadata is committed
        if: steps.verify.outputs.written == 'true'
        run: |
          echo "::error::Dependencies were not verified: commit the gradle/verification-metadata.xml the jobs wrote (the union of every job's verification-metadata-* artifact; see gate/README.md)."
          exit 1

  smoke:
    name: App smoke test (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.event_name == 'pull_request' && format('ci-smoke-pr-{0}', github.ref) || format('ci-smoke-{0}', github.run_id) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Dependency verification mode
        id: verify
        run: .github/scripts/verify-mode.sh

      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 /usr/lib/jvm/temurin-21-jdk-amd64 || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch the app on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          VERIFY: ${{ steps.verify.outputs.flag }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon $VERIFY :app:connectedDebugAndroidTest :core:runtime:connectedDebugAndroidTest :tunnels:updater:connectedDebugAndroidTest :tunnels:crossroads:connectedDebugAndroidTest :tunnels:watch:connectedDebugAndroidTest :tunnels:devicecheck:connectedDebugAndroidTest :tunnels:pairing:connectedDebugAndroidTest

      # The test APK carries AndroidX test components and permissions, so this checks gate.py's manifest
      # reading against aapt2 on a real APK that has them.
      - name: Cross-check gate.py against aapt2 on the app's test APK
        run: |
          echo "::group::gate.py inspect app-debug-androidTest.apk"
          python3 gate/gate.py inspect --require-tools --apk app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          echo "::endgroup::"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: app-smoke-reports
          path: |
            app/build/reports/androidTests/
            core/runtime/build/reports/androidTests/
            tunnels/updater/build/reports/androidTests/
            tunnels/crossroads/build/reports/androidTests/
            tunnels/watch/build/reports/androidTests/
            tunnels/devicecheck/build/reports/androidTests/
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.verify.outputs.written == 'true'
        with:
          name: verification-metadata-smoke
          path: gradle/verification-metadata.xml
          retention-days: 14

      - name: Print the written metadata as annotations, part 1 (for sessions that cannot download artifacts)
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-smoke 0

      - name: Print the written metadata as annotations, part 2
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-smoke 10

      - name: Print the written metadata as annotations, part 3
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-smoke 20

      - name: Fail until the dependency verification metadata is committed
        if: steps.verify.outputs.written == 'true'
        run: |
          echo "::error::Dependencies were not verified: commit the gradle/verification-metadata.xml the jobs wrote (the union of every job's verification-metadata-* artifact; see gate/README.md)."
          exit 1

  # Read-only checks before publishing: the commit is on the integration branch, and the APK is signed by the
  # certificate pinned in gate/baseline.json (the public debug key for now: it catches an accidental key change,
  # not an impostor). They run the repository's gate/ script, so they live in a job without a writing token;
  # the publish job below runs no repository code.
  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/ccr-dff99af5-ij1rle'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      apk_sha256: ${{ steps.cert.outputs.apk_sha256 }}
    steps:
      # Only the gate files: the baseline of the commit the APK was built from, and the script.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
          sparse-checkout: gate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tunnels-debug-apk
          path: apks

      # The branch is resolved to its SHA first, so a tag or branch with a similar name can't stand in for it.
      - name: Check the commit is on the integration branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.build.outputs.sha }}
          BRANCH: ccr-dff99af5-ij1rle
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$head...$TARGET" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::$TARGET is not on $BRANCH (compare status: $status), so it is not published."
            exit 1
          fi

      - name: Check the signing certificate against gate/baseline.json
        id: cert
        run: |
          apk=apks/app-debug.apk
          python3 gate/gate.py cert --require-pin --apk "$apk"
          echo "apk_sha256=$(sha256sum "$apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

  # Publishes "Debug build #N" as a prerelease with a plain .apk (Actions artifacts always arrive zipped), newest
  # first, keeping the newest 10. Only pushes to the integration branch get here; the build above passed the
  # gate, and release-check passed the certificate and branch checks.
  publish:
    needs: [build, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers on this environment make each publish wait for RJ's approval (docs/RELEASING.md).
    environment: publish
    # Publishes for one ref go one at a time and a running one is never cancelled. The group lives on this job
    # alone, so build and smoke for later pushes are not held while a publish waits for approval. (GitHub keeps
    # one pending run per group: if two later publishes are queued behind a waiting one, the older queued one
    # is dropped. Its APK stays an artifact for 30 days.)
    concurrency:
      group: ci-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # creates the prerelease and uploads the APK
      id-token: write # signs the build provenance attestation
      attestations: write # stores the attestation next to the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: tunnels-debug-apk
          path: apks

      # Publishes exactly the APK release-check checked.
      - name: Check the APK is the one that was checked
        env:
          CHECKED: ${{ needs.release-check.outputs.apk_sha256 }}
        run: |
          actual=$(sha256sum apks/app-debug.apk | cut -d' ' -f1)
          if [ -z "$CHECKED" ] || [ "$actual" != "$CHECKED" ]; then
            echo "::error::apks/app-debug.apk ($actual) is not the APK release-check checked ($CHECKED)"
            exit 1
          fi

      - name: Name the APK for the release
        env:
          N: ${{ github.run_number }}
        run: |
          cp apks/app-debug.apk "tunnels-debug-$N.apk"
          # The in-app updater checks the download against this.
          sha256sum "tunnels-debug-$N.apk" > "tunnels-debug-$N.apk.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tunnels-debug-${{ github.run_number }}.apk

      - name: Publish debug build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          N: ${{ github.run_number }}
          TARGET: ${{ needs.build.outputs.sha }}
        run: |
          short="${TARGET::7}"
          apk="tunnels-debug-$N.apk"
          {
            gh api "repos/$GITHUB_REPOSITORY/commits/$TARGET" --jq .commit.message
            echo
            echo "---"
            echo "Debug build #$N of \`$short\` from \`$GITHUB_REF_NAME\`. Installs as \"Tunnels\" (package \`io.github.stronghorse44.tunnels.debug\`) and updates over earlier debug builds."
          } > notes.md
          gh release create "debug-$N" "$apk" "$apk.sha256" --prerelease --target "$TARGET" \
            --title "Debug build #$N ($short)" --notes-file notes.md
          gh release delete debug-latest --yes --cleanup-tag 2>/dev/null || true
          gh release list --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E '^debug-[0-9]+$' | sort -t- -k2 -n -r | tail -n +11 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
