# The vX.Y.Z release channel (docs/RELEASING.md): release-signed APKs, published as the GitHub release vX.Y.Z.
#
# Trigger: a push to the integration branch that changes the VERSION file (a merged pull request that bumps
# it), or workflow_dispatch. There is no tag trigger (a tag can name any commit, with any workflow file, and
# the `signing` environment has no reviewer, so a tag push must not be able to reach the key), and no push
# trigger on main (it only receives versions that are already released). The version always comes from the
# VERSION file at the run's commit (docs/RELEASING.md has its format); it is never typed. A push means
# "publish": the owner's approval at the `publish` environment is the control. The one dispatch input:
#   publish   default false. false is a DRY RUN: it builds, runs the release gate and rehearses signing with a
#             throwaway key, and stops; `sign`, `release-check` and `publish` do not run, so nothing is signed or
#             published. true runs the whole chain and, at the end, creates the tag and the release. It is
#             refused unless the run is on the integration branch or main.
#
# Signing split (the program's spec 5.1). The four signing secrets are secrets of the `signing` environment
# (restricted to the integration branch and main; no reviewers) and are referenced in exactly one job, `sign`. That job checks out nothing and runs no repository or third-party
# code: only GitHub's own actions, gh, the runner's JDK 17 and its Android SDK tools. No job that runs this
# repository's code references a secret. The release is built UNSIGNED by `build`, which also runs the release
# gate (gate/gate.py against gate/baseline.release.json) and a signing rehearsal with a throwaway key.
#
#   plan           no checkout, no repository code. reads VERSION, decides what this run does   -> tag, code, build, release
#   build          no environment. unsigned APK, tests, gate, rehearsal            -> unsigned-apk
#   sign           environment: signing. ref check, decode key, align, sign, verify -> signed-apk (1 day)
#   release-check  certificate pin (gate.py cert --require-pin), version, order    -> checked sha256
#   publish        environment: publish (the owner's approval). attest, tag, release
#
# Who can push to the integration branch and main is the control on the key: a VERSION merge or a
# publish=true dispatch from either one signs without a reviewer (one approval per release, at `publish`). The
# signed APK exists as a run artifact (downloadable by signed-in users, 1 day) before that approval, and only on
# runs that will ask for it: `plan` stops a run whose version is already released, malformed, out of order or
# otherwise refused before anything is built or signed.
#
# Every job after `build` is gated by a job-level `if:` written against the event context (never against an
# output a build step could set): a push to the integration branch, or a dispatch with publish=true on the
# integration branch or main. `plan` runs no repository code and its output can only narrow that (AND), never
# widen it. sign and release-check also check the built commit is on one of those branches (compare API against
# the branch's SHA) before anything is decoded or published.
#
# Version: VERSION holds exactly MAJOR.MINOR.PATCH, each a number from 0 to 999 without leading zeros, not
# 0.0.0. The tag is vMAJOR.MINOR.PATCH, versionName is MAJOR.MINOR.PATCH and versionCode is
# MAJOR*1000000 + MINOR*1000 + PATCH, so versions order the way their codes do. plan, release-check and publish
# (with gh only) refuse a version whose code is not above every other vX.Y.Z release's (rollback is a higher
# version, never a lower one), and a version whose release or tag already exists at another commit. A push whose
# VERSION is already released ends green in `plan`, with nothing built or signed. The release is named by its
# tag, vX.Y.Z; the in-app updater follows exactly those tags (core/updates).

name: Release

on:
  push:
    branches: ["ccr-dff99af5-ij1rle"]
    paths: ["VERSION"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish it. Off = dry run: build, gate and rehearse only. Only from the integration branch or main."
        required: false
        default: false
        type: boolean

permissions: {}

env:
  # The Android SDK build-tools that align, sign and verify the APK, by version, so the signing tools only
  # change in a pull request. A dry run's rehearsal fails if the runner lacks them.
  BUILD_TOOLS_VERSION: "36.0.0"
  # The signature schemes of every release: v2 only, as in the program's other repos (v1 is never needed at
  # minSdk 34). A later key rotation adds v3/v3.1 with a signing lineage. Each of v1-v4 must be set.
  SIGNING_SCHEMES: "--v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled false --v4-signing-enabled false"
  # tunnels-release.jks was made with JDK 17's keytool, which writes PKCS12.
  KEYSTORE_TYPE: PKCS12

jobs:
  # Decides what this run does before anything is built or signed, so nothing is signed for a version that will
  # be refused and the release-signed artifact exists only on runs that will ask the owner. It checks out nothing
  # and runs no repository code: it reads VERSION at the run's commit through the API, with gh and jq only. It
  # can only narrow what the later jobs' event-context conditions allow, never widen it.
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      code: ${{ steps.plan.outputs.code }}
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - name: Read VERSION and decide what this run does
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_PUBLISH: ${{ inputs.publish }}
        run: |
          integration=refs/heads/ccr-dff99af5-ij1rle
          short="${SHA::7}"
          # What kind of run this is. A push means publish (the owner's approval at `publish` is the control); a
          # dispatch publishes only when ticked, and only from the integration branch or main.
          if [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_PUBLISH" = true ]; then
            mode=publish
            if [ "$REF" != "$integration" ] && [ "$REF" != refs/heads/main ]; then
              echo "::error::publish=true only runs from the integration branch or main, not from $REF. Run it there, or leave publish off for a dry run."
              exit 1
            fi
          elif [ "$EVENT" = workflow_dispatch ]; then
            mode=dry
          elif [ "$EVENT" = push ] && [ "$REF" = "$integration" ]; then
            mode=push
          else
            echo "::error::Nothing is planned for a $EVENT event on $REF."
            exit 1
          fi
          # Only a 404 means "not there": any other API failure stops the job.
          out=
          lookup() {
            local err
            err=$(mktemp -p "$RUNNER_TEMP")
            if out=$(gh api "$1" 2> "$err"); then rm -f "$err"; return 0; fi
            if grep -q 'HTTP 404' "$err"; then rm -f "$err"; out=; return 1; fi
            cat "$err" >&2; exit 1
          }
          # Keep parse_version and read_version identical in plan and release-check (and parse_version in ci.yml's
          # Check VERSION step).
          # parse_version $1: the file. The bytes must be MAJOR.MINOR.PATCH or that plus one newline, at most 12 bytes
          # (each part 0-999, no leading zero, no v, no CR, no spaces, no BOM). Sets version, tag, name and code, or
          # says why not and returns 1.
          parse_version() {
            local f=$1 size body last first ok=false
            local re='^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
            size=$(LC_ALL=C wc -c < "$f")
            body=$(LC_ALL=C cat "$f" 2>/dev/null)
            last=$(LC_ALL=C tail -c1 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$size" -le 12 ] && [[ "$body" =~ $re ]]; then
              code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
              if [ "$size" -eq "${#body}" ]; then
                ok=true
              elif [ "$size" -eq $(( ${#body} + 1 )) ] && [ "$last" = 0a ]; then
                ok=true
              fi
            fi
            if [ "$ok" != true ]; then
              first=$(LC_ALL=C head -c 20 "$f" | LC_ALL=C tr -cd '[:print:]')
              echo "::error::VERSION must be a regular file holding one line like 0.1.1 (each part 0-999, no leading zeros, no 'v'), got '$first'."
              return 1
            fi
            if [ "$code" -lt 1 ]; then
              echo "::error::VERSION 0.0.0 is not a release version."
              return 1
            fi
            version=$body
            tag="v$body"
            name=$body
          }
          # read_version $1: a commit SHA. Reads VERSION there through the contents API (404 = missing; it must be a
          # file), then parse_version; any failure stops the job.
          read_version() {
            local sha=$1 kind vfile="$RUNNER_TEMP/VERSION.read"
            if ! lookup "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha"; then
              echo "::error::VERSION is missing at $sha; nothing is built."
              exit 1
            fi
            kind=$(jq -r 'if type=="object" then "\(.type) \(.encoding)" else "not an object" end' <<< "$out" 2>/dev/null) || kind="not JSON"
            if [ "$kind" != "file base64" ]; then
              echo "::error::VERSION must be a regular file holding one line like 0.1.1 (each part 0-999, no leading zeros, no 'v'), got 'not a regular file'."
              exit 1
            fi
            jq -r .content <<< "$out" | base64 -d > "$vfile" 2>/dev/null || : > "$vfile"
            parse_version "$vfile" || exit 1
            rm -f "$vfile"
          }
          read_version "$SHA"
          re='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          # The release and the tag for this version, and the highest other release. Read into variables first: a
          # failed API call must stop the job, not read as "no earlier release".
          have_release=false
          existing=
          if lookup "repos/$GITHUB_REPOSITORY/releases/tags/$tag"; then
            have_release=true
            existing=$(jq -r .target_commitish <<< "$out")
          fi
          have_tag=false
          if lookup "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"; then
            have_tag=true
          fi
          others=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          highest=0
          while read -r other; do
            if [ "$other" != "$tag" ] && [[ "$other" =~ $re ]]; then
              c=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
              if [ "$c" -gt "$highest" ]; then highest=$c; fi
            fi
          done <<< "$others"
          check_order() {
            if [ "$code" -le "$highest" ]; then
              echo "::error::$tag (version code $code) is not above the highest earlier release (version code $highest). A release must be a higher version than every other vX.Y.Z; to roll back, release a higher version."
              exit 1
            fi
          }
          # Decide. build: whether the build job runs. release: whether sign, release-check and publish run.
          build=true
          release=true
          case "$mode" in
            push)
              if [ "$have_release" = true ]; then
                echo "::notice::$tag is already released (at $existing); nothing to build. Bump VERSION in a pull request to release."
                build=false
                release=false
              elif [ "$have_tag" = true ]; then
                echo "::error::Tag $tag exists without a release. Nothing is signed; look at the tag by hand (docs/RELEASING.md)."
                exit 1
              else
                check_order
                echo "::notice::Releasing $tag (version code $code) from $REF at $short, after the signing job and the owner's approval."
              fi
              ;;
            publish)
              if [ "$have_release" = true ] && [ "$existing" != "$SHA" ]; then
                echo "::error::Release $tag already exists for '$existing', not this commit ($SHA). A published version is never replaced by another commit; release a higher version."
                exit 1
              fi
              # A tag without a release is left to release-check, which allows one at the built commit.
              check_order
              echo "::notice::Publishing $tag (version code $code) from $REF at $short, after the signing job and the owner's approval."
              ;;
            dry)
              release=false
              if [ "$have_release" = true ]; then
                echo "::notice::DRY RUN of $tag (version code $code) at $REF $short: $tag is already released (at $existing); this run still builds, gates and rehearses signing, and nothing is signed or published."
              else
                check_order
                echo "::notice::DRY RUN of $tag (version code $code) at $REF $short: builds, gates and rehearses signing; nothing is signed or published."
              fi
              ;;
          esac
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "code=$code"
            echo "build=$build"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  # Builds, tests and gates the unsigned release. Skipped when `plan` finds nothing to build (a push whose
  # VERSION is already released); the later jobs need it and so are skipped with it.
  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Fails closed before anything is built: no release without a reviewed release baseline.
      - name: Require the release baseline
        run: |
          if [ ! -f gate/baseline.release.json ]; then
            echo "::error::gate/baseline.release.json is missing, so there is no reviewed record of what a release build may do. Nothing is built."
            exit 1
          fi

      # setup-java replaces JAVA_HOME_17_X64, so note the runner's own JDK 17 (the one the sign job uses) first,
      # for the signing rehearsal.
      - name: Note the runner's JDK 17
        run: echo "RUNNER_JDK_17=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      # No build cache: what is built here is what gets signed, and a poisoned cache entry must not reach it.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true

      - name: Check the Gradle wrapper against Gradle's published checksums
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          version=$(sed -n 's#^distributionUrl=.*/gradle-\(.*\)-bin\.zip$#\1#p' "$props")
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-bin.zip.sha256")
          pinned=$(sed -n 's/^distributionSha256Sum=//p' "$props")
          if [ "$published" != "$pinned" ]; then
            echo "::error::distributionSha256Sum ($pinned) is not Gradle's published checksum ($published)"
            exit 1
          fi
          published=$(curl -fsSL "https://services.gradle.org/distributions/gradle-$version-wrapper.jar.sha256")
          actual=$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)
          if [ "$published" != "$actual" ]; then
            echo "::error::gradle-wrapper.jar ($actual) is not Gradle's published $version wrapper ($published)"
            exit 1
          fi
          echo "Gradle $version wrapper and distribution checksums match gradle.org"

      - name: Dependency verification mode
        id: verify
        run: .github/scripts/verify-mode.sh

      # The release variant comes out unsigned (app/build.gradle.kts gives it no signing config): the sign job
      # signs the finished file.
      - name: Build the unsigned release
        env:
          VERIFY: ${{ steps.verify.outputs.flag }}
          VERSION_CODE: ${{ needs.plan.outputs.code }}
          VERSION_NAME: ${{ needs.plan.outputs.name }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon --stacktrace $VERIFY \
            --init-script gate/file-dependencies.init.gradle -Pgate.configuration=releaseRuntimeClasspath \
            -Ptunnels.versionCode="$VERSION_CODE" -Ptunnels.versionName="$VERSION_NAME" \
            test verifyPermissions assembleRelease \
            :app:dependencies --configuration releaseRuntimeClasspath gateFileDependencies | tee "$RUNNER_TEMP/gradle.log"

      - name: Check permissions and that the APK is unsigned
        run: |
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$apk" ]; then
            echo "::error::$apk is missing: the release build must come out unsigned. Found:"
            ls -la app/build/outputs/apk/release
            exit 1
          fi
          scripts/check-apk-permissions.sh "$apk" release
          # A release that is already signed must never be re-signed by this path. Only apksigner's exit
          # status decides; its message is logged, never matched.
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [ ! -x "$tools/apksigner" ]; then
            echo "::error::build-tools $BUILD_TOOLS_VERSION is not on this runner (has: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')). Update BUILD_TOOLS_VERSION."
            exit 1
          fi
          if said=$("$tools/apksigner" verify "$apk" 2>&1); then
            echo "apksigner verify said: $said"
            echo "::error::$apk already carries a valid signature; the release build must come out unsigned."
            exit 1
          fi
          echo "apksigner verify refused the unsigned input, as expected: $said"

      # The certificate is compared in release-check, on the signed APK. --require-pin here only checks that
      # the baseline holds a pin.
      - name: Release gate (compare the unsigned release APK with gate/baseline.release.json)
        id: gate
        run: |
          # The pinned build-tools, not the newest installed (gate.py reads these two variables).
          export APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner"
          export AAPT2="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/aapt2"
          python3 gate/gate.py check --baseline gate/baseline.release.json --require-tools --require-pin \
            --apk app/build/outputs/apk/release/app-release-unsigned.apk --deps "$RUNNER_TEMP/gradle.log" \
            --generated build/gate/baseline.generated.json
          unset APKSIGNER AAPT2
          python3 -m unittest discover -s gate

      # The same zipalign and apksigner commands the sign job runs, with a throwaway key made here, so a run
      # shows that the pinned build-tools exist and that the result carries exactly the release's signature
      # schemes. No secret is involved. It cannot catch a wrong keystore type for the real key.
      - name: Rehearse release signing with a throwaway key
        run: |
          set -o pipefail
          # The same JDK the sign job uses (the runner's JDK 17), not the one Gradle runs with.
          if [ -z "$RUNNER_JDK_17" ] || [ ! -x "$RUNNER_JDK_17/bin/java" ]; then
            echo "::error::The runner has no JDK 17 at JAVA_HOME_17_X64 (RUNNER_JDK_17 is '$RUNNER_JDK_17')."
            exit 1
          fi
          export JAVA_HOME="$RUNNER_JDK_17"
          export PATH="$JAVA_HOME/bin:$PATH"
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          # Keep these two functions identical in the rehearsal (build job) and in the sign job. The expected
          # "Verified using" lines follow from SIGNING_SCHEMES, so the flags and the checks cannot drift
          # apart; v3.1 needs key rotation, never here. $1 is the file holding apksigner's verify output.
          validate_schemes() {
            local expected
            expected=$(xargs -n2 <<< "$SIGNING_SCHEMES" | sed -E 's/^--v([0-9]+)-signing-enabled (true|false)$/\1 \2/')
            if [ "$(cut -d' ' -f1 <<< "$expected" | sort | tr '\n' ' ')" != "1 2 3 4 " ]; then
              echo "::error::SIGNING_SCHEMES must set each of --v1/--v2/--v3/--v4-signing-enabled to true or false, once"
              return 1
            fi
          }
          check_schemes() {
            local expected v value name
            validate_schemes || return 1
            expected=$(xargs -n2 <<< "$SIGNING_SCHEMES" | sed -E 's/^--v([0-9]+)-signing-enabled (true|false)$/\1 \2/')
            expected+=$'\n'"3.1 false"
            while read -r v value; do
              case "$v" in 1) name="v1 scheme (JAR signing)" ;; *) name="v$v scheme (APK Signature Scheme v$v)" ;; esac
              grep -qxF "Verified using $name: $value" "$1" || { echo "::error::Expected 'Verified using $name: $value'"; return 1; }
            done <<< "$expected"
          }
          validate_schemes
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/zipalign" ]; then
            echo "::error::build-tools $BUILD_TOOLS_VERSION is not on this runner (has: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')). Update BUILD_TOOLS_VERSION."
            exit 1
          fi
          work="$RUNNER_TEMP/rehearsal"
          mkdir -p "$work"
          keytool -genkeypair -keystore "$work/throwaway.p12" -storetype "$KEYSTORE_TYPE" -storepass throwaway \
            -keypass throwaway -alias throwaway -keyalg RSA -keysize 2048 -validity 1 -dname CN=throwaway
          read -ra schemes <<< "$SIGNING_SCHEMES"
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$work/aligned.apk"
          "$tools/apksigner" sign --ks "$work/throwaway.p12" --ks-type "$KEYSTORE_TYPE" --ks-key-alias throwaway \
            --ks-pass pass:throwaway --key-pass pass:throwaway "${schemes[@]}" --out "$work/signed.apk" "$work/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "$work/signed.apk"
          "$tools/apksigner" verify --print-certs -v "$work/signed.apk" | tee "$work/verify.txt"
          check_schemes "$work/verify.txt"
          rm -rf "$work"

      # So a session that can't download artifacts can copy the baseline this APK would need.
      - name: Print the baseline this APK would need
        if: failure() && steps.gate.outcome == 'failure' && hashFiles('build/gate/baseline.generated.json') != ''
        run: |
          echo "::group::build/gate/baseline.generated.json"
          cat build/gate/baseline.generated.json
          echo "::endgroup::"
          gate/annotate-file.sh build/gate/baseline.generated.json baseline-release-generated 0

      # The sign job signs exactly this file. 30 days; only the signed APK (1 day) has to outlive the approval wait.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-apk
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/gate/
          retention-days: 14

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && steps.verify.outputs.written == 'true'
        with:
          name: verification-metadata-release
          path: gradle/verification-metadata.xml
          retention-days: 14

      - name: Print the written metadata as annotations, part 1 (for sessions that cannot download artifacts)
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-release 0

      - name: Print the written metadata as annotations, part 2
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-release 10

      - name: Print the written metadata as annotations, part 3
        if: always() && steps.verify.outputs.written == 'true'
        run: gate/annotate-file.sh gradle/verification-metadata.xml verification-metadata-release 20

      - name: Fail until the dependency verification metadata is committed
        if: steps.verify.outputs.written == 'true'
        run: |
          echo "::error::Dependencies were not verified: commit the gradle/verification-metadata.xml the jobs wrote (the union of every job's verification-metadata-* artifact; see gate/README.md)."
          exit 1

  # Signs the APK the build job built. The only job that references the signing secrets, so it checks out
  # nothing and runs no repository or third-party code: GitHub's own actions, gh and the runner's JDK 17 and
  # Android SDK tools only. The secrets are secrets of the `signing` environment, which only the integration
  # branch and main can use, whatever this file says. No reviewers on `signing`: the owner's one
  # approval is the `publish` environment's, at the end.
  sign:
    if: >-
      needs.plan.outputs.release == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/ccr-dff99af5-ij1rle') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish &&
         (github.ref == 'refs/heads/ccr-dff99af5-ij1rle' || github.ref == 'refs/heads/main')))
    needs: [plan, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: signing
    permissions:
      contents: read
    outputs:
      apk_sha256: ${{ steps.sign.outputs.apk_sha256 }}
    steps:
      # The branches are resolved to their SHAs first, so a tag or branch with a similar name can't stand in.
      - name: Check the commit is on the integration branch or main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.build.outputs.sha }}
        run: |
          for branch in ccr-dff99af5-ij1rle main; do
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha) || continue
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$head...$TARGET" --jq .status) || continue
            if [ "$status" = "identical" ] || [ "$status" = "behind" ]; then
              echo "$TARGET is on $branch."
              exit 0
            fi
          done
          echo "::error::$TARGET is not on ccr-dff99af5-ij1rle or main, so it is not signed."
          exit 1

      # The runner's preinstalled JDK 17, the one the build job's rehearsal runs apksigner with (no action,
      # nothing is downloaded into the job that holds the key).
      - name: Use the runner's JDK 17
        run: |
          if [ ! -x "$JAVA_HOME_17_X64/bin/java" ]; then
            echo "::error::The runner has no JDK 17 at JAVA_HOME_17_X64."
            exit 1
          fi
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-apk
          path: unsigned

      - name: Sign the APK
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          # Keep these two functions identical in the rehearsal (build job) and in the sign job. The expected
          # "Verified using" lines follow from SIGNING_SCHEMES, so the flags and the checks cannot drift
          # apart; v3.1 needs key rotation, never here. $1 is the file holding apksigner's verify output.
          validate_schemes() {
            local expected
            expected=$(xargs -n2 <<< "$SIGNING_SCHEMES" | sed -E 's/^--v([0-9]+)-signing-enabled (true|false)$/\1 \2/')
            if [ "$(cut -d' ' -f1 <<< "$expected" | sort | tr '\n' ' ')" != "1 2 3 4 " ]; then
              echo "::error::SIGNING_SCHEMES must set each of --v1/--v2/--v3/--v4-signing-enabled to true or false, once"
              return 1
            fi
          }
          check_schemes() {
            local expected v value name
            validate_schemes || return 1
            expected=$(xargs -n2 <<< "$SIGNING_SCHEMES" | sed -E 's/^--v([0-9]+)-signing-enabled (true|false)$/\1 \2/')
            expected+=$'\n'"3.1 false"
            while read -r v value; do
              case "$v" in 1) name="v1 scheme (JAR signing)" ;; *) name="v$v scheme (APK Signature Scheme v$v)" ;; esac
              grep -qxF "Verified using $name: $value" "$1" || { echo "::error::Expected 'Verified using $name: $value'"; return 1; }
            done <<< "$expected"
          }
          unsigned=unsigned/app-release-unsigned.apk
          if [ ! -f "$unsigned" ]; then
            echo "::error::$unsigned is missing from the build job's unsigned-apk artifact."
            exit 1
          fi
          validate_schemes
          # A missing tool must fail here, not pass the guard below (a verify that cannot run also "fails").
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/zipalign" ]; then
            echo "::error::build-tools $BUILD_TOOLS_VERSION is not on this runner (has: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')). Update BUILD_TOOLS_VERSION."
            exit 1
          fi
          # The input must be unsigned: a signed APK (say, debug-signed) is never re-signed by the release path.
          # Only apksigner's exit status decides; its message is logged, never matched.
          if said=$("$tools/apksigner" verify "$unsigned" 2>&1); then
            echo "apksigner verify said: $said"
            echo "::error::$unsigned already carries a valid signature; only an unsigned APK is signed here."
            exit 1
          fi
          echo "apksigner verify refused the unsigned input, as expected: $said"
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::The signing secrets KEYSTORE_BASE64, KEY_ALIAS, KEYSTORE_PASSWORD and KEY_PASSWORD must all be set in the signing environment (docs/RELEASING.md). Nothing is published without them."
            exit 1
          fi
          umask 077
          keystore="$RUNNER_TEMP/tunnels-release.jks"
          trap 'rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unset KEYSTORE_BASE64
          read -ra schemes <<< "$SIGNING_SCHEMES"
          mkdir signed
          signed=signed/app-release.apk
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-type "$KEYSTORE_TYPE" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD "${schemes[@]}" \
            --out "$signed" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore" "$RUNNER_TEMP/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "$signed"
          "$tools/apksigner" verify --print-certs -v "$signed" | tee "$RUNNER_TEMP/verify.txt"
          check_schemes "$RUNNER_TEMP/verify.txt"
          echo "apk_sha256=$(sha256sum "$signed" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tunnels-release.jks" "$RUNNER_TEMP/aligned.apk"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-apk
          path: signed/app-release.apk
          if-no-files-found: error
          # One day: this is a release-signed APK that exists before the owner has approved anything. Approve the
          # same day, or start the run again.
          retention-days: 1

  # Read-only checks before the owner is asked to approve: the commit is on a release branch, the signed APK is
  # the one `sign` uploaded, it is this app at this version, and it carries the certificate pinned in
  # gate/baseline.release.json. They run the repository's gate/ script, so they live in a job with no writing
  # token and no signing secret; the publish job below runs no repository code.
  release-check:
    if: >-
      needs.plan.outputs.release == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/ccr-dff99af5-ij1rle') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish &&
         (github.ref == 'refs/heads/ccr-dff99af5-ij1rle' || github.ref == 'refs/heads/main')))
    needs: [plan, build, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      apk_sha256: ${{ steps.cert.outputs.apk_sha256 }}
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
    steps:
      # Only the gate files: the baseline of the commit the APK was built from, and the script.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
          sparse-checkout: gate

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-apk
          path: apks

      # The branches are resolved to their SHAs first, so a tag or branch with a similar name can't stand in.
      - name: Check the commit is on the integration branch or main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ needs.build.outputs.sha }}
        run: |
          for branch in ccr-dff99af5-ij1rle main; do
            head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha) || continue
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$head...$TARGET" --jq .status) || continue
            if [ "$status" = "identical" ] || [ "$status" = "behind" ]; then
              echo "$TARGET is on $branch."
              exit 0
            fi
          done
          echo "::error::$TARGET is not on ccr-dff99af5-ij1rle or main, so it is not published."
          exit 1

      # The version, from VERSION at the built commit again (not from the plan job): it must be the version the
      # plan job planned; the rule that a version is higher than every other vX.Y.Z release (rolling back is
      # releasing a higher version); and that a release or tag that already exists for this version points at the
      # commit being published, so a re-dispatch of a published version at another commit stops here, before the
      # owner is asked to approve anything.
      - name: Version, order and what already exists
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          PLAN_TAG: ${{ needs.plan.outputs.tag }}
          TARGET: ${{ needs.build.outputs.sha }}
        run: |
          # Only a 404 means "not there": any other API failure stops the job.
          out=
          lookup() {
            local err
            err=$(mktemp -p "$RUNNER_TEMP")
            if out=$(gh api "$1" 2> "$err"); then rm -f "$err"; return 0; fi
            if grep -q 'HTTP 404' "$err"; then rm -f "$err"; out=; return 1; fi
            cat "$err" >&2; exit 1
          }
          # Keep parse_version and read_version identical in plan and release-check (and parse_version in ci.yml's
          # Check VERSION step).
          # parse_version $1: the file. The bytes must be MAJOR.MINOR.PATCH or that plus one newline, at most 12 bytes
          # (each part 0-999, no leading zero, no v, no CR, no spaces, no BOM). Sets version, tag, name and code, or
          # says why not and returns 1.
          parse_version() {
            local f=$1 size body last first ok=false
            local re='^(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
            size=$(LC_ALL=C wc -c < "$f")
            body=$(LC_ALL=C cat "$f" 2>/dev/null)
            last=$(LC_ALL=C tail -c1 "$f" | od -An -tx1 | tr -d ' \n')
            if [ "$size" -le 12 ] && [[ "$body" =~ $re ]]; then
              code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
              if [ "$size" -eq "${#body}" ]; then
                ok=true
              elif [ "$size" -eq $(( ${#body} + 1 )) ] && [ "$last" = 0a ]; then
                ok=true
              fi
            fi
            if [ "$ok" != true ]; then
              first=$(LC_ALL=C head -c 20 "$f" | LC_ALL=C tr -cd '[:print:]')
              echo "::error::VERSION must be a regular file holding one line like 0.1.1 (each part 0-999, no leading zeros, no 'v'), got '$first'."
              return 1
            fi
            if [ "$code" -lt 1 ]; then
              echo "::error::VERSION 0.0.0 is not a release version."
              return 1
            fi
            version=$body
            tag="v$body"
            name=$body
          }
          # read_version $1: a commit SHA. Reads VERSION there through the contents API (404 = missing; it must be a
          # file), then parse_version; any failure stops the job.
          read_version() {
            local sha=$1 kind vfile="$RUNNER_TEMP/VERSION.read"
            if ! lookup "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha"; then
              echo "::error::VERSION is missing at $sha; nothing is built."
              exit 1
            fi
            kind=$(jq -r 'if type=="object" then "\(.type) \(.encoding)" else "not an object" end' <<< "$out" 2>/dev/null) || kind="not JSON"
            if [ "$kind" != "file base64" ]; then
              echo "::error::VERSION must be a regular file holding one line like 0.1.1 (each part 0-999, no leading zeros, no 'v'), got 'not a regular file'."
              exit 1
            fi
            jq -r .content <<< "$out" | base64 -d > "$vfile" 2>/dev/null || : > "$vfile"
            parse_version "$vfile" || exit 1
            rm -f "$vfile"
          }
          # body_type $1: jq's name for the JSON type of an API answer, or non-JSON (also for an empty answer).
          body_type() {
            local t
            t=$(jq -r type <<< "$1" 2>/dev/null) || t=
            echo "${t:-non-JSON}"
          }
          # Keep resolve_tag identical in release-check and publish (like the signing functions). It follows the tag ref
          # to what it points at and stops the job unless that is the commit being published ($TARGET). $1 the tag,
          # $2 the body of the git/ref/tags/<tag> lookup, $3 the job's closing words for each error. Only the object
          # type and sha are read, after checking the answer has that shape (a jq error counts as malformed).
          resolve_tag() {
            local tag=$1 body=$2 end=$3 shape answer kind sha n err
            shape='if type=="object" and (.object|type)=="object" and (.object.type|type)=="string" and (.object.sha|type)=="string" and (.object.sha|test("^[0-9a-f]{40}$")) then .object.type+" "+.object.sha else empty end'
            answer=$(jq -r "$shape" <<< "$body" 2>/dev/null) || answer=
            if [ -z "$answer" ]; then
              echo "::error::GitHub's answer for refs/tags/$tag is not one ref with object.type and object.sha (got $(body_type "$body")).$end"
              exit 1
            fi
            kind=${answer%% *}
            sha=${answer#* }
            for n in 1 2 3 4 5; do
              [ "$kind" = tag ] || break
              err=$(mktemp -p "$RUNNER_TEMP")
              if ! body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" 2> "$err"); then
                cat "$err" >&2
                rm -f "$err"
                echo "::error::Could not read annotated tag object $sha (level $n under $tag); the API call failed.$end"
                exit 1
              fi
              rm -f "$err"
              answer=$(jq -r "$shape" <<< "$body" 2>/dev/null) || answer=
              if [ -z "$answer" ]; then
                echo "::error::Annotated tag object $sha (level $n under $tag) has no object.type and object.sha (got $(body_type "$body")).$end"
                exit 1
              fi
              kind=${answer%% *}
              sha=${answer#* }
            done
            if [ "$kind" = tag ]; then
              echo "::error::Tag $tag is still an annotated tag after 5 levels (at $sha); deeper chains are refused.$end"
              exit 1
            fi
            if [ "$kind" != commit ]; then
              echo "::error::Tag $tag ends at a $kind ($sha), not a commit, so it is refused.$end"
              exit 1
            fi
            if [ "$sha" != "$TARGET" ]; then
              echo "::error::Tag $tag exists at $sha ($kind), not at the commit being published ($TARGET).$end"
              exit 1
            fi
          }
          read_version "$TARGET"
          if [ "v$version" != "$PLAN_TAG" ]; then
            echo "::error::VERSION at the built commit ($TARGET) says '$version', not the planned $PLAN_TAG."
            exit 1
          fi
          tag="$PLAN_TAG"
          re='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          if [[ ! "$tag" =~ $re ]]; then
            echo "::error::The version must look like v1.2.3 (each part 0-999, no leading zeros), got '$tag'"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          if [ "$code" -lt 1 ]; then
            echo "::error::v0.0.0 is not a release version"; exit 1
          fi
          # Read into a variable first: a failed API call must stop the job, not read as "no earlier release".
          others=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          highest=0
          while read -r other; do
            if [ "$other" != "$tag" ] && [[ "$other" =~ $re ]]; then
              c=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
              if [ "$c" -gt "$highest" ]; then highest=$c; fi
            fi
          done <<< "$others"
          if [ "$code" -le "$highest" ]; then
            echo "::error::$tag (version code $code) is not above the highest earlier release (version code $highest). A release must be a higher version than every other vX.Y.Z; to roll back, release a higher version."
            exit 1
          fi
          if lookup "repos/$GITHUB_REPOSITORY/releases/tags/$tag"; then
            existing=$(jq -r .target_commitish <<< "$out")
            if [ "$existing" != "$TARGET" ]; then
              echo "::error::Release $tag already exists for '$existing', not this commit ($TARGET). A published version is never replaced by another commit; release a higher version."
              exit 1
            fi
          fi
          # The tag itself too, whether or not a release exists: a release's target_commitish says where it was meant
          # to point, the tag ref says where the tag does, and the two can differ. An annotated tag is followed to
          # its commit (a tag of a tag too, at most 5 levels); anything that does not end at a commit is refused.
          if lookup "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag"; then
            resolve_tag "$tag" "$out" " Nothing is published."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      # Fails on an unsigned APK or a certificate other than the one pinned, so a build signed with a different
      # key is never offered as an update. The APK must also be the file `sign` uploaded, this app (not the
      # debug package) and exactly this version.
      - name: Check the signed APK
        id: cert
        env:
          SIGNED: ${{ needs.sign.outputs.apk_sha256 }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          apk=apks/app-release.apk
          actual=$(sha256sum "$apk" | cut -d' ' -f1)
          if [ -z "$SIGNED" ] || [ "$actual" != "$SIGNED" ]; then
            echo "::error::$apk ($actual) is not the file the sign job uploaded ($SIGNED)"
            exit 1
          fi
          # The pinned build-tools, not the newest installed (gate.py reads these two variables).
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [ ! -x "$tools/apksigner" ] || [ ! -x "$tools/aapt2" ]; then
            echo "::error::build-tools $BUILD_TOOLS_VERSION is not on this runner (has: $(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')). Update BUILD_TOOLS_VERSION."
            exit 1
          fi
          APKSIGNER="$tools/apksigner" AAPT2="$tools/aapt2" \
            python3 gate/gate.py cert --baseline gate/baseline.release.json --require-pin --apk "$apk"
          badging=$("$tools/aapt2" dump badging "$apk" | grep '^package:')
          echo "$badging"
          for want in "name='io.github.stronghorse44.tunnels'" "versionCode='$CODE'" "versionName='$NAME'"; do
            if ! grep -qF " $want " <<< "$badging "; then
              echo "::error::The APK's package line does not say $want"
              exit 1
            fi
          done
          echo "apk_sha256=$actual" >> "$GITHUB_OUTPUT"

  # Publishes the release. Its environment waits for the owner's approval. It holds the only writing token and
  # runs no repository code and no script from the repository: gh and GitHub's own actions only. The concurrency
  # group is one constant for every ref, so a run from main and a run from the integration branch cannot publish
  # at the same time (the order re-check below then sees the earlier one's release); it lives on this job alone, so
  # builds and signing for later runs are not held while a publish waits. GitHub keeps one pending run per group:
  # a run waiting behind another replaces an older waiting one, so start the replaced one again.
  publish:
    if: >-
      needs.plan.outputs.release == 'true' && (
        (github.event_name == 'push' && github.ref == 'refs/heads/ccr-dff99af5-ij1rle') ||
        (github.event_name == 'workflow_dispatch' && inputs.publish &&
         (github.ref == 'refs/heads/ccr-dff99af5-ij1rle' || github.ref == 'refs/heads/main')))
    needs: [plan, build, release-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: publish
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write # creates the tag and the release and uploads the APK
      id-token: write # signs the build provenance attestation
      attestations: write # stores the attestation next to the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: signed-apk
          path: apks

      # Publishes exactly the APK release-check checked, under the version it checked.
      - name: Check the APK and the version are the ones that were checked
        env:
          CHECKED: ${{ needs.release-check.outputs.apk_sha256 }}
          TAG: ${{ needs.release-check.outputs.tag }}
          NAME: ${{ needs.release-check.outputs.name }}
          PLAN_TAG: ${{ needs.plan.outputs.tag }}
        run: |
          actual=$(sha256sum apks/app-release.apk | cut -d' ' -f1)
          if [ -z "$CHECKED" ] || [ "$actual" != "$CHECKED" ]; then
            echo "::error::apks/app-release.apk ($actual) is not the APK release-check checked ($CHECKED)"
            exit 1
          fi
          if [ -z "$TAG" ] || [ "$TAG" != "$PLAN_TAG" ] || [ "v$NAME" != "$TAG" ]; then
            echo "::error::release-check checked '$TAG' ('$NAME'), not the planned '$PLAN_TAG'"
            exit 1
          fi

      - name: Name the APK for the release
        env:
          NAME: ${{ needs.release-check.outputs.name }}
        run: |
          cp apks/app-release.apk "tunnels-$NAME.apk"
          # The in-app updater checks the download against this.
          sha256sum "tunnels-$NAME.apk" > "tunnels-$NAME.apk.sha256"

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tunnels-${{ needs.release-check.outputs.name }}.apk

      # Creates the tag at the built commit and the release with gh only: no third-party action runs next to the
      # writing token, and no repository code. The release is named by its tag, vX.Y.Z, which is what the in-app
      # updater follows. The version-order and existing-release checks are made again here, after the approval
      # wait. The constant concurrency group makes publishes one at a time across refs, so this sees the release
      # an earlier run just made, whichever branch it came from.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-check.outputs.tag }}
          NAME: ${{ needs.release-check.outputs.name }}
          TARGET: ${{ needs.build.outputs.sha }}
        run: |
          apk="tunnels-$NAME.apk"
          re='^v(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})$'
          [[ "$TAG" =~ $re ]]
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          # Only a 404 means "not there": any other API failure stops the job.
          out=
          lookup() {
            local err
            err=$(mktemp -p "$RUNNER_TEMP")
            if out=$(gh api "$1" 2> "$err"); then rm -f "$err"; return 0; fi
            if grep -q 'HTTP 404' "$err"; then rm -f "$err"; out=; return 1; fi
            cat "$err" >&2; exit 1
          }
          # body_type $1: jq's name for the JSON type of an API answer, or non-JSON (also for an empty answer).
          body_type() {
            local t
            t=$(jq -r type <<< "$1" 2>/dev/null) || t=
            echo "${t:-non-JSON}"
          }
          # Keep resolve_tag identical in release-check and publish (like the signing functions). It follows the tag ref
          # to what it points at and stops the job unless that is the commit being published ($TARGET). $1 the tag,
          # $2 the body of the git/ref/tags/<tag> lookup, $3 the job's closing words for each error. Only the object
          # type and sha are read, after checking the answer has that shape (a jq error counts as malformed).
          resolve_tag() {
            local tag=$1 body=$2 end=$3 shape answer kind sha n err
            shape='if type=="object" and (.object|type)=="object" and (.object.type|type)=="string" and (.object.sha|type)=="string" and (.object.sha|test("^[0-9a-f]{40}$")) then .object.type+" "+.object.sha else empty end'
            answer=$(jq -r "$shape" <<< "$body" 2>/dev/null) || answer=
            if [ -z "$answer" ]; then
              echo "::error::GitHub's answer for refs/tags/$tag is not one ref with object.type and object.sha (got $(body_type "$body")).$end"
              exit 1
            fi
            kind=${answer%% *}
            sha=${answer#* }
            for n in 1 2 3 4 5; do
              [ "$kind" = tag ] || break
              err=$(mktemp -p "$RUNNER_TEMP")
              if ! body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" 2> "$err"); then
                cat "$err" >&2
                rm -f "$err"
                echo "::error::Could not read annotated tag object $sha (level $n under $tag); the API call failed.$end"
                exit 1
              fi
              rm -f "$err"
              answer=$(jq -r "$shape" <<< "$body" 2>/dev/null) || answer=
              if [ -z "$answer" ]; then
                echo "::error::Annotated tag object $sha (level $n under $tag) has no object.type and object.sha (got $(body_type "$body")).$end"
                exit 1
              fi
              kind=${answer%% *}
              sha=${answer#* }
            done
            if [ "$kind" = tag ]; then
              echo "::error::Tag $tag is still an annotated tag after 5 levels (at $sha); deeper chains are refused.$end"
              exit 1
            fi
            if [ "$kind" != commit ]; then
              echo "::error::Tag $tag ends at a $kind ($sha), not a commit, so it is refused.$end"
              exit 1
            fi
            if [ "$sha" != "$TARGET" ]; then
              echo "::error::Tag $tag exists at $sha ($kind), not at the commit being published ($TARGET).$end"
              exit 1
            fi
          }
          others=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --jq '.[].tag_name')
          highest=0
          while read -r other; do
            if [ "$other" != "$TAG" ] && [[ "$other" =~ $re ]]; then
              c=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
              if [ "$c" -gt "$highest" ]; then highest=$c; fi
            fi
          done <<< "$others"
          if [ "$code" -le "$highest" ]; then
            echo "::error::$TAG (version code $code) is not above the highest release now published (version code $highest). Nothing is published; release a higher version."
            exit 1
          fi
          # A re-run after a partly finished publish finds the release already there. Its APK is replaced only
          # when the release already points at the commit being published (a re-run of that commit); anything
          # else is a different build trying to overwrite a published one. The generated notes carry no APK
          # hash, so there is nothing to refresh.
          have_release=false
          if lookup "repos/$GITHUB_REPOSITORY/releases/tags/$TAG"; then
            existing=$(jq -r .target_commitish <<< "$out")
            if [ "$existing" != "$TARGET" ]; then
              echo "::error::Release $TAG already exists for '$existing', not this commit ($TARGET). Not replacing its APK."
              exit 1
            fi
            have_release=true
          fi
          # The tag ref too, with or without a release (a release's target_commitish and the tag can differ): it
          # must be the commit being published, or gh would replace the APK of, or attach this one to, another
          # commit's tag. An annotated tag is followed to its commit (at most 5 levels); anything that does not
          # end at a commit is refused. Only a 404 means there is no tag.
          if lookup "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG"; then
            resolve_tag "$TAG" "$out" " Not replacing or creating the release."
          fi
          if [ "$have_release" = true ]; then
            gh release upload "$TAG" "$apk" "$apk.sha256" --clobber
            exit 0
          fi
          gh release create "$TAG" "$apk" "$apk.sha256" --target "$TARGET" --title "$TAG" --generate-notes
