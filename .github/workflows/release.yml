name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          name="${tag#v}"
          if [[ ! "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3, got $tag"; exit 1
          fi
          code=$(( BASH_REMATCH[1] * 1000000 + BASH_REMATCH[2] * 1000 + BASH_REMATCH[3] ))
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Repository secret KEYSTORE_BASE64 is not set. See docs/RELEASING.md."; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release
        env:
          TUNNELS_KEYSTORE: ${{ runner.temp }}/release.jks
          TUNNELS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TUNNELS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TUNNELS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew --no-daemon test verifyPermissions assembleRelease
          -Ptunnels.versionCode=${{ steps.version.outputs.code }}
          -Ptunnels.versionName=${{ steps.version.outputs.name }}

      - name: Check permissions and signature
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          scripts/check-apk-permissions.sh "$apk" release
          build_tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$build_tools/apksigner" verify --print-certs "$apk"
          out="tunnels-${{ steps.version.outputs.name }}.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          "tunnels-${{ steps.version.outputs.name }}.apk"
          "tunnels-${{ steps.version.outputs.name }}.apk.sha256"
          --title "Tunnels ${{ steps.version.outputs.name }}"
          --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
