name: Phase 1

# Tests only the modules that belong to phase 1. Runs on this phase's branches, integration and main when they change.
on:
  push:
    branches:
      - 'phase/1-**'
      - 'ccr-dff99af5-ij1rle'
      - 'main'
    paths:
      - 'tunnels/permissions/**'
      - 'tunnels/apk/**'
      - 'tunnels/hardening/**'
      - 'tunnels/doors/**'
      - 'tunnels/truststore/**'
      - 'tunnels/syspackages/**'
      - 'tunnels/silicon/**'
      - 'tunnels/explore/**'
      - 'tunnels/snapshots/**'
      - 'core/permrules/**'
      - 'core/trackers/**'
      - 'core/elf/**'
      - 'core/certs/**'
      - 'core/syspkg/**'
      - 'core/attestation/**'
      - 'core/export/**'
      - '.github/workflows/ci-phase-1.yml'
  pull_request:
    paths:
      - 'tunnels/permissions/**'
      - 'tunnels/apk/**'
      - 'tunnels/hardening/**'
      - 'tunnels/doors/**'
      - 'tunnels/truststore/**'
      - 'tunnels/syspackages/**'
      - 'tunnels/silicon/**'
      - 'tunnels/explore/**'
      - 'tunnels/snapshots/**'
      - 'core/permrules/**'
      - 'core/trackers/**'
      - 'core/elf/**'
      - 'core/certs/**'
      - 'core/syspkg/**'
      - 'core/attestation/**'
      - 'core/export/**'
      - '.github/workflows/ci-phase-1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and permission checks
        run: ./gradlew --no-daemon :tunnels:permissions:testDebugUnitTest :tunnels:permissions:verifyPermissions :tunnels:apk:testDebugUnitTest :tunnels:apk:verifyPermissions :tunnels:hardening:testDebugUnitTest :tunnels:hardening:verifyPermissions :tunnels:doors:testDebugUnitTest :tunnels:doors:verifyPermissions :tunnels:truststore:testDebugUnitTest :tunnels:truststore:verifyPermissions :tunnels:syspackages:testDebugUnitTest :tunnels:syspackages:verifyPermissions :tunnels:silicon:testDebugUnitTest :tunnels:silicon:verifyPermissions :tunnels:explore:testDebugUnitTest :tunnels:explore:verifyPermissions :tunnels:snapshots:testDebugUnitTest :tunnels:snapshots:verifyPermissions :core:permrules:test :core:trackers:test :core:elf:test :core:certs:test :core:syspkg:test :core:attestation:test :core:export:test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1-unit-reports
          path: |
            tunnels/*/build/reports/tests/
            core/*/build/reports/tests/
          retention-days: 7

  emulator:
    name: Instrumented tests (emulator)
    # Emulator minutes are the expensive part: always on integration and main, and on a phase branch
    # only when the commit message carries [emulator] (builders tag their final commit).
    if: github.ref_name == 'ccr-dff99af5-ij1rle' || github.ref_name == 'main' || github.event_name != 'push' || contains(github.event.head_commit.message, '[emulator]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Free disk space for the emulator image
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift /usr/local/share/powershell \
            /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64 /usr/lib/jvm/temurin-21-jdk-amd64 || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew --no-daemon :tunnels:permissions:connectedDebugAndroidTest :tunnels:apk:connectedDebugAndroidTest :tunnels:hardening:connectedDebugAndroidTest :tunnels:doors:connectedDebugAndroidTest :tunnels:truststore:connectedDebugAndroidTest :tunnels:syspackages:connectedDebugAndroidTest :tunnels:silicon:connectedDebugAndroidTest :tunnels:explore:connectedDebugAndroidTest :tunnels:snapshots:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-1-instrumented-reports
          path: tunnels/*/build/reports/androidTests/
          retention-days: 7
